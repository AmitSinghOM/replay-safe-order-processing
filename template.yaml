AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Replay-safe order processing (API Gateway, Lambda, SQS + DLQ, DynamoDB)

Parameters:
  WorkerMaxConcurrency:
    Type: Number
    Default: 2
    MinValue: 2
    Description: SQS event-source maximum concurrency (AWS minimum is 2). Caps load on slow dependencies.
  MaxReceiveCount:
    Type: Number
    Default: 5
    Description: Deliveries before a message is moved to the DLQ.
  IdempotencyWindowSeconds:
    Type: Number
    Default: 86400
  DependencyDelayMs:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 1500 # 10 records x 1.5 s stays inside the 30 s worker timeout
    Description: Load tests only. Simulated slow dependency inside the worker, before the commit.

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    CodeUri: src/
    MemorySize: 256
    Timeout: 10
    LoggingConfig:
      LogFormat: JSON
    Environment:
      Variables:
        TABLE_NAME: !Ref OrdersTable
        QUEUE_URL: !Ref OrdersQueue
        LOG_LEVEL: INFO

Resources:
  OrdersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete # demo stack: `sam delete` removes data too
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: N }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        # Sparse "not yet sent" index: only orders whose RESERVE message may be
        # missing carry gsi1pk/gsi1sk. The reconciler reads it; it is normally empty.
        - IndexName: gsi1
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: KEYS_ONLY }
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  OrdersDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600 # 14 days
      SqsManagedSseEnabled: true

  OrdersQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 180 # 6x the 30 s worker timeout, per AWS guidance for SQS event sources
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OrdersDLQ.Arn
        maxReceiveCount: !Ref MaxReceiveCount

  OrdersApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: v1
      # Service-to-service callers sign with SigV4. No anonymous access.
      Auth:
        DefaultAuthorizer: AWS_IAM
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: 50
          ThrottlingBurstLimit: 100

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: orders.handlers.api.lambda_handler
      Environment:
        Variables:
          IDEMPOTENCY_WINDOW_S: !Ref IdempotencyWindowSeconds
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref OrdersTable }
        - SQSSendMessagePolicy: { QueueName: !GetAtt OrdersQueue.QueueName }
      Events:
        CreateOrder:
          Type: Api
          Properties: { RestApiId: !Ref OrdersApi, Path: /orders, Method: post }
        GetOrder:
          Type: Api
          Properties: { RestApiId: !Ref OrdersApi, Path: "/orders/{order_id}", Method: get }
        CancelOrder:
          Type: Api
          Properties: { RestApiId: !Ref OrdersApi, Path: "/orders/{order_id}/cancel", Method: post }
        ConfirmOrder:
          Type: Api
          Properties: { RestApiId: !Ref OrdersApi, Path: "/orders/{order_id}/confirm", Method: post }

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: orders.handlers.worker.lambda_handler
      Timeout: 30
      Environment:
        Variables:
          DEPENDENCY_DELAY_MS: !Ref DependencyDelayMs
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref OrdersTable }
      Events:
        Orders:
          Type: SQS
          Properties:
            Queue: !GetAtt OrdersQueue.Arn
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig:
              MaximumConcurrency: !Ref WorkerMaxConcurrency

  ReconcileFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: orders.handlers.reconcile.lambda_handler
      Environment:
        Variables:
          STALE_AFTER_S: "300"
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref OrdersTable }
        - SQSSendMessagePolicy: { QueueName: !GetAtt OrdersQueue.QueueName }
      Events:
        Every5Min:
          Type: Schedule
          Properties: { Schedule: rate(5 minutes) }

  QueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Oldest order message is older than 10 minutes; the worker is down, throttled or too slow.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - { Name: QueueName, Value: !GetAtt OrdersQueue.QueueName }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 5
      Threshold: 600
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  DlqNotEmptyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Messages are in the order DLQ; run scripts/replay_dlq.py after fixing the cause.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - { Name: QueueName, Value: !GetAtt OrdersDLQ.QueueName }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiUrl:
    Value: !Sub "https://${OrdersApi}.execute-api.${AWS::Region}.amazonaws.com/v1"
  TableName:
    Value: !Ref OrdersTable
  QueueUrl:
    Value: !Ref OrdersQueue
  DeadLetterQueueUrl:
    Value: !Ref OrdersDLQ
  WorkerFunctionName:
    Value: !Ref WorkerFunction
