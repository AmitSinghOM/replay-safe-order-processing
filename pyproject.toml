[project]
name = "replay-safe-orders"
version = "0.1.0"
description = "Replay-safe order processing on AWS: duplicate-safe effects inside a DynamoDB transaction boundary"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
aws = ["boto3==1.35.99"]  # Lambda runtime ships boto3; needed locally for scripts/ only

[dependency-groups]
dev = ["pytest==8.3.4", "ruff==0.8.4", "boto3==1.35.99", "moto[dynamodb,sqs]==5.0.26"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: timing-based local load runs (a few seconds)"]
filterwarnings = ["ignore:datetime.datetime.utcnow:DeprecationWarning:botocore"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741"]
